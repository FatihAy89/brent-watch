name: Daten-Update (versetzt)

# Zweiter, zeitversetzter Cron als unabhängige Chance gegen GitHubs
# Scheduler-Drosselung. Identischer Job wie update.yml; die geteilte
# concurrency-Gruppe verhindert parallele Läufe, Leerläufe committen nichts.

on:
  schedule:
    - cron: "14,44 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Daten holen
        run: node scripts/fetch_data.mjs

      - name: Committen & pushen
        run: |
          git config user.name "brent-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/data.json
          git diff --cached --quiet && echo "Keine Änderungen" && exit 0
          git commit -m "data: stündliches Update"
          git pull --rebase -X theirs origin main
          git push
