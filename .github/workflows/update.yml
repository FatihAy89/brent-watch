name: Stündliches Daten-Update

on:
  schedule:
    # GitHub drosselt Cron-Läufe in freien Repos stark (real feuern nur
    # wenige pro Tag) – daher dicht geplant; update-b.yml läuft versetzt
    # als zweite unabhängige Chance. Leerläufe committen nichts.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:       # manueller Start über den Actions-Tab

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Daten holen
        run: node scripts/fetch_data.mjs

      - name: Committen & pushen
        run: |
          git config user.name "brent-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/data.json
          git diff --cached --quiet && echo "Keine Änderungen" && exit 0
          git commit -m "data: stündliches Update"
          git pull --rebase -X theirs origin main
          git push
